# Example: dark mode via ui-orchestrator slots (no partial collisions)
# Requires ui-orchestrator from valentus-theme (git path or npm) as the extension host.
# Do NOT point ui.bundle at the Valentus release zip here — that zip already includes dark mode.
# Use Default UI (or another base) when composing the dark-mode-only recipe.

site:
  title: My Documentation Site

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

ui:
  bundle:
    # Base theme without bundled dark mode — not antora-dark-mode, not Valentus release zip
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true

antora:
  extensions:
    - require: ./node_modules/valentus-theme/ui-modules/packages/orchestrator/lib/index.js
      registry: ./node_modules/antora-dark-mode/ui-modules/registry.json5
      recipe: dark-mode-only

output:
  dir: ./build/site

asciidoc:
  attributes:
    source-highlighter: highlight.js
    icons: font
