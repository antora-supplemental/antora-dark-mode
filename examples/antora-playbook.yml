# Example Antora Playbook with Dark Theme
# Copy this file to your documentation project root and customize as needed

site:
  title: My Documentation Site
  # url: https://docs.example.com
  # start_page: component::index.adoc
  # keys:
  #   header_logo: mybrand.svg          # supplemental-ui-overrides/img/mybrand.svg
  #   site_home_url: https://example.com
  #   header_doc_title: My Docs

content:
  sources:
    # Local documentation source
    - url: .
      branches: HEAD
      start_path: docs
    # Remote Git repository (uncomment to use)
    # - url: https://github.com/your-org/your-repo.git
    #   branches: [main, v*]
    #   start_path: docs

ui:
  bundle:
    # Convenience bundle (Default UI + dark mode pre-merged). For theme mixing see antora-playbook-overlay.yml.
    url: https://github.com/antora-supplemental/antora-dark-mode/releases/download/v1.2.0/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui-overrides

output:
  dir: ./build/site

asciidoc:
  attributes:
    source-highlighter: highlight.js
    icons: font
