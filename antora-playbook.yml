# Antora Playbook (online / production)
# Refreshes remote assets before generating the site. Use for CI and deploy.

site:
  title: Antora Dark Mode
  url: https://antora-supplemental.github.io/antora-dark-mode
  start_page: antora-dark-mode:guide:index.adoc

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs

# This repo's demo uses overlay install (Default UI + ./supplemental-ui).
# Consumers: overlay on your theme bundle, ui-module slots, or convenience ui-bundle.zip — see README.
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

runtime:
  fetch: true

antora:
  extensions:
    - require: "@antora/lunr-extension"
      index_latest_only: true
      index_by_heading: true
      snippet_length: 200

asciidoc:
  extensions:
    - "@asciidoctor/tabs"
  attributes:
    source-highlighter: highlight.js
    icons: font
